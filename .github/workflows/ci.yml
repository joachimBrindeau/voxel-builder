name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, klarc, voxel-builder]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git show --check --format= HEAD
      - name: Run full skill gate
        run: bash scripts/lint.sh
