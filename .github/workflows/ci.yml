name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git show --check --format= HEAD
      - name: Check shell scripts
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check Python and JSON
        run: |
          python3 -m compileall -q scripts
          find . -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Validate repository-owned contracts
        run: |
          python3 scripts/test-skill-contract.py
          sh scripts/test-lib.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [str(path) for path in sorted(Path("templates").rglob("template.json"))]
          subprocess.run(
              ["python3", "scripts/migrate-template-content-rows.py", "--check", *paths],
              check=True,
          )
          PY
          python3 scripts/lint-workflow-structure.py
          python3 scripts/check-field-metadata-contract.py
          python3 scripts/test-field-metadata-run-validator.py
          python3 scripts/test-organization-profile-validator.py
          python3 scripts/test-geo-payload-validator.py
